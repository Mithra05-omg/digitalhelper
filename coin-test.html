<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin test</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F5F4F0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#0B1220;overflow-x:hidden}
.hero{position:relative;min-height:100svh;padding-top:70px}
.lap{width:min(1086px,90vw);margin:0 auto;position:relative;z-index:1}
.lap img{display:block;width:100%;height:auto}
#stage{position:absolute;inset:0;z-index:2;pointer-events:none}
#stage canvas{pointer-events:none}
.tag{position:absolute;left:20px;top:16px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#5B6270;z-index:3}
button{position:fixed;right:18px;top:12px;z-index:5;border:0;border-radius:999px;padding:10px 18px;font:600 14px system-ui,sans-serif;background:#0B1220;color:#fff;cursor:pointer}
.fallback{display:none;position:absolute;left:0;right:0;bottom:20px;text-align:center;color:#5B6270;z-index:4}
@media (max-width:760px){ .hero{padding-bottom:150px} }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="tag">Coin test, not the final page</div>
  <div class="lap" id="lap"><img id="img" src="laptop.webp" width="1500" height="971" alt="Laptop"></div>
  <div id="stage"></div>
  <div class="fallback" id="fb">Your browser cannot show 3D. The real page will show flat coins.</div>
  <button id="again" type="button">Play again</button>
</div>
<script src="coins.js"></script>
<script>
(function () {
  var hero = document.getElementById('hero');
  var stage = document.getElementById('stage');
  var lap = document.getElementById('lap');
  var img = document.getElementById('img');

  /* Slide the laptop left only when the right side is too narrow for four coins. */
  function fit(r) {
    lap.style.transform = '';
    var vw = hero.clientWidth;
    if (vw < 760) { return; }
    var box = lap.getBoundingClientRect();
    var need = 8 * r + 3 * r * 0.12 + r * 2.2 + 18;
    var room = vw - box.right;
    if (room < need) {
      var shift = Math.min(need - room, box.left - 12);
      lap.style.transform = 'translateX(' + (-shift) + 'px)';
    }
  }

  var coins = DHCoins.startCoins({
    stage: stage,
    letters: ['N', 'E', 'X', 'T'],
    getLayout: function (w, h) {
      var small = w < 760;
      var r = small ? Math.min(34, (w - 36) / 8.6) : Math.max(26, Math.min(36, w * 0.019));
      fit(r);
      var pr = hero.getBoundingClientRect();
      var b = img.getBoundingClientRect();
      if (small) {
        return { r: r, floor: b.bottom - pr.top + 2 * r + 24, wall: 18 };
      }
      return { r: r, floor: b.top - pr.top + b.height * 0.80, wall: b.right - pr.left - b.width * 0.012 };
    }
  });
  if (!coins) { document.getElementById('fb').style.display = 'block'; return; }
  function go() { coins.play(); }
  if (img.complete) { setTimeout(go, 500); } else { img.addEventListener('load', function () { setTimeout(go, 500); }); }
  document.getElementById('again').addEventListener('click', go);
  window.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    stage.dispatchEvent(new PointerEvent('pointermove', { clientX: e.clientX, clientY: e.clientY }));
  }, { passive: true });
})();
</script>
</body>
</html>
