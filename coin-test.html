<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin test</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.panel{position:relative;height:calc(100svh - 28px);margin:14px;border-radius:22px;background:#ff2a5c;overflow:hidden;touch-action:pan-y}
.screen{position:absolute;left:6%;top:22%;width:34%;aspect-ratio:16/10;border-radius:14px;background:#161d25;border:10px solid #0b1016;box-shadow:0 30px 60px rgba(90,0,25,.35);display:grid;place-items:center;color:#7d8b99;font-size:14px}
.base{position:absolute;left:3%;width:40%;top:calc(22% + 34vw * 0.625 + 20px);height:14px;border-radius:0 0 18px 18px;background:#0b1016}
.title{position:absolute;left:24px;top:18px;color:#fff;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
#stage{position:absolute;inset:0}
button{position:absolute;right:20px;top:14px;z-index:5;border:0;border-radius:999px;padding:10px 18px;font:600 14px system-ui,sans-serif;background:#fff;color:#161d25;cursor:pointer}
.note{position:absolute;left:24px;bottom:16px;color:#fff;font-size:13px;opacity:.85;z-index:5}
.fallback{position:absolute;inset:0;display:none;place-items:center;color:#fff;text-align:center;padding:30px;z-index:4}
@media (max-width:700px){
  .screen{left:8%;top:14%;width:84%}
  .base{display:none}
}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="title">Coin test, not the final page</div>
  <div class="screen" id="screen">your demo screenshot goes here</div>
  <div class="base"></div>
  <div id="stage"></div>
  <div class="fallback" id="fb">Your browser cannot show 3D. The real page will show a flat version.</div>
  <button id="again" type="button">Play again</button>
  <div class="note">Move your mouse or finger across the coins to push them.</div>
</div>
<script src="coins.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var screen = document.getElementById('screen');
  var coins = DHCoins.startCoins({
    stage: stage,
    letters: ['N', 'E', 'X', 'T'],
    getFrom: function () {
      var s = screen.getBoundingClientRect(), p = stage.getBoundingClientRect();
      return { x: s.left - p.left + s.width / 2, y: s.top - p.top + s.height / 2 };
    },
    getRow: function (w, h) {
      var small = w < 700;
      var r = Math.max(34, Math.min(small ? 52 : 92, w * (small ? 0.12 : 0.058)));
      if (small) { return { x0: w * 0.14 + 0, x1: w * 0.86, floor: h * 0.80, r: r }; }
      return { x0: w * 0.52, x1: w * 0.92, floor: h * 0.86, r: r };
    }
  });
  if (!coins) { document.getElementById('fb').style.display = 'grid'; return; }
  setTimeout(function () { coins.play(); }, 400);
  document.getElementById('again').addEventListener('click', function () { coins.play(); });
  window.__coins = coins;
})();
</script>
</body>
</html>
